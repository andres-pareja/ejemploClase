<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora Pixel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="arcade-cabinet">
    <h1 class="titulo">CALCULADORA<span>PIXEL</span></h1>

    <div class="pantalla-marco">
      <div class="pantalla">
        <div id="display-historial" class="display-historial"></div>
        <div id="display-actual" class="display-actual">0</div>
      </div>
    </div>

    <div id="mensaje-error" class="mensaje-error" aria-live="polite"></div>

    <div class="teclado">
      <button class="tecla tecla-funcion" data-accion="limpiar">C</button>
      <button class="tecla tecla-funcion" data-accion="borrar">DEL</button>
      <button class="tecla tecla-funcion" data-accion="porcentaje">%</button>
      <button class="tecla tecla-operador" data-operacion="division">÷</button>

      <button class="tecla tecla-numero" data-numero="7">7</button>
      <button class="tecla tecla-numero" data-numero="8">8</button>
      <button class="tecla tecla-numero" data-numero="9">9</button>
      <button class="tecla tecla-operador" data-operacion="multiplicacion">×</button>

      <button class="tecla tecla-numero" data-numero="4">4</button>
      <button class="tecla tecla-numero" data-numero="5">5</button>
      <button class="tecla tecla-numero" data-numero="6">6</button>
      <button class="tecla tecla-operador" data-operacion="resta">−</button>

      <button class="tecla tecla-numero" data-numero="1">1</button>
      <button class="tecla tecla-numero" data-numero="2">2</button>
      <button class="tecla tecla-numero" data-numero="3">3</button>
      <button class="tecla tecla-operador" data-operacion="suma">+</button>

      <button class="tecla tecla-numero tecla-cero" data-numero="0">0</button>
      <button class="tecla tecla-numero" data-numero=".">.</button>
      <button class="tecla tecla-igual" data-accion="igual">=</button>
    </div>

    <p class="pie">API: <span id="estado-api">conectando...</span></p>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
